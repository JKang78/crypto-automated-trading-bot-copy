name: Six-Coin vs Three-Coin Paper Comparison

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Independent of the live controller; serialize updates to this paper account.
concurrency:
  group: ml-six-coin-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paper-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      # Restore errors fail the run instead of silently resetting the account.
      # A normal cache miss starts a new simulated account; archives remain below.
      - name: Restore paper comparison state
        id: paper-state
        uses: actions/cache/restore@v4
        with:
          path: paper_comparison_state.json
          key: ml-six-coin-paper-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ml-six-coin-paper-state-v1-${{ github.ref_name }}-

      # Public market data only. Do not inject exchange or messaging credentials.
      - name: Advance simulated portfolios
        run: >-
          python ml_portfolio_paper.py
          --state-file paper_comparison_state.json
          --report-file paper_comparison_report.md
          --start-equity 170

      - name: Save updated paper comparison state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: paper_comparison_state.json
          key: ${{ steps.paper-state.outputs.cache-primary-key }}

      - name: Publish paper report to run summary
        if: always() && hashFiles('paper_comparison_report.md') != ''
        run: cat paper_comparison_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive paper state and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-coin-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            paper_comparison_state.json
            paper_comparison_report.md
          if-no-files-found: warn
          retention-days: 90
